<!--
  Google Analytics 4 with Consent Mode v2.

  Overrides Material's built-in Google provider partial
  (partials/integrations/analytics/google.html).

  gtag.js always loads, but starts with analytics_storage denied, so
  non-consenting visitors are measured via cookieless consent-mode pings
  (aggregate/modeled data only). When a visitor accepts the analytics
  cookie in Material's consent banner, we upgrade consent to granted and
  full first-party measurement begins. This respects the cookie-consent
  control required by the site's authenticated (Supabase) experience
  while restoring analytics coverage.
-->
<script>
  (function () {
    var property = "{{ config.extra.analytics.property }}";

    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    window.gtag = gtag;

    // Default everything to denied until the visitor opts in.
    gtag("consent", "default", {
      ad_storage: "denied",
      ad_user_data: "denied",
      ad_personalization: "denied",
      analytics_storage: "denied",
      wait_for_update: 500
    });

    gtag("js", new Date());
    gtag("config", property);

    // Material stores consent as JSON under a key SCOPED BY SITE PATH, not
    // under a bare "__consent". On runbook.fyi the real key is "/.__consent"
    // (the sibling "/.__palette" key is written the same way). Reading the
    // unscoped name returned null even for visitors who had accepted, so the
    // "granted" update below was never sent and GA4 only ever saw cookieless
    // consent-mode pings. Check every key that could hold it rather than
    // hardcoding one guess about Material's prefix.
    var granted = false;
    function readConsent() {
      var candidates = ["__consent"];
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k !== "__consent" && k.slice(-10) === ".__consent") {
            candidates.push(k);
          }
        }
      } catch (e) {
        // localStorage can throw outright (Safari private mode, blocked
        // third-party context). Fall through with what we have.
      }
      for (var j = 0; j < candidates.length; j++) {
        try {
          var c = JSON.parse(localStorage.getItem(candidates[j]));
          if (c && c.analytics) return true;
        } catch (e) {
          // Malformed value under one key must not hide a valid one.
        }
      }
      return false;
    }
    function syncConsent() {
      if (granted) return;
      if (readConsent()) {
        gtag("consent", "update", { analytics_storage: "granted" });
        granted = true;
        stopPolling();
      }
    }
    function stopPolling() {
      if (poll) { clearInterval(poll); poll = null; }
    }

    // Returning visitors who accepted previously.
    syncConsent();
    // Catch a same-tab "Accept" without a page reload (Material does not
    // reload on consent change, and the storage event is cross-tab only).
    // Bounded: a visitor who has not decided within two minutes is not going
    // to be caught by a timer that runs for the life of the tab.
    var ticks = 0;
    var poll = granted ? null : setInterval(function () {
      if (++ticks > 120) return stopPolling();
      syncConsent();
    }, 1000);
  })();
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id={{ config.extra.analytics.property }}"></script>

<!-- Page feedback widget event tracking (preserved from Material's default). -->
{% if config.extra.analytics.feedback %}
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (document$) {
        document$.subscribe(function() {
          var feedback = document.forms.feedback
          if (typeof feedback === "undefined")
            return

          /* Set up event handlers for feedback widget */
          for (var button of feedback.querySelectorAll("[type=submit]")) {
            button.addEventListener("click", function(e) {
              e.preventDefault()

              /* Retrieve and send feedback value */
              var page = document.location.pathname
              var data = this.getAttribute("data-md-value")
              gtag("event", "feedback", {
                "event_category": page,
                "event_label": data,
                "value": data
              })

              /* Disable form and show note, if given */
              feedback.firstElementChild.disabled = true
              var note = feedback.querySelector(
                ".md-feedback__note [data-md-value='" + data + "']"
              )
              if (note)
                note.hidden = false
            })

            /* Show feedback widget */
            button.disabled = false
          }
        })
      }
    })
  </script>
{% endif %}
