name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libffi-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare docs directory
        run: ./setup-docs.sh

      - name: Build site (strict mode)
        run: mkdocs build --strict

      # v4+ excludes dotfiles from the artifact; the built site has none
      # (CNAME is not hidden), so the default is correct here.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
